name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    uses: greylocklabs/.github/.github/workflows/commitlint.yml@v1
    with:
      submodules: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint markdown
        run: npx markdownlint-cli2

      - name: Check formatting of docs and config
        run: npm run format:md:check

      - name: Check that every file names the same version
        run: core/tooling/check-version.sh

      # The runner image ships shellcheck.
      - name: Lint the shell scripts
        run: |
          shellcheck tests/package_smoke.sh
          shellcheck -s sh www/install.sh tests/install_test.sh

  format:
    # Needs clang-format and qmlformat, so it runs where Qt is packaged.
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install tools
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git diffutils clang-tools-extra qt6-qtdeclarative-devel

      - uses: actions/checkout@v7
        with:
          submodules: true

      # checkout only trusts the workspace for its own step, and this container
      # user does not own it, so git would refuse to list files.
      - name: Check C++ and QML formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./core/tooling/format.sh check

  s3:
    # Sync against a real S3-compatible store: MinIO, beside a Fedora build on one network.
    name: sync with S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Start MinIO
        run: |
          docker network create jot
          docker run -d --name minio --network jot \
            -e MINIO_ROOT_USER=jottest -e MINIO_ROOT_PASSWORD=jottestsecret \
            minio/minio:latest server /data

      - name: Build and test against it
        run: |
          docker run --rm --network jot -v "$PWD:/src" -w /src \
            -e JOT_TEST_S3="s3:http://minio:9000/jot-test?region=us-east-1" \
            -e JOT_TEST_S3_KEY="jottest:jottestsecret" \
            fedora:44 bash -ec '
              dnf install -y --setopt=install_weak_deps=False curl gcc-c++ cmake ninja-build \
                make qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
                tomlplusplus-devel kf6-syntax-highlighting-devel qtkeychain-qt6-devel
              for try in $(seq 30); do
                curl -sf http://minio:9000/minio/health/live && break
                sleep 1
              done
              curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user jottest:jottestsecret \
                -X PUT http://minio:9000/jot-test
              cmake --preset ci
              cmake --build --preset ci --target tst_s3
              QT_QPA_PLATFORM=offscreen build/ci/tests/tst_s3'

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
          - name: debian
            image: debian:trixie
          - name: ubuntu
            image: ubuntu:26.04
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # git has to exist before checkout, or the action cannot clone.
      - name: Install build dependencies (Fedora)
        if: matrix.name == 'fedora'
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ cmake ninja-build make
          qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel
          tomlplusplus-devel kf6-syntax-highlighting-devel qtkeychain-qt6-devel

      - name: Install build dependencies (Debian and Ubuntu)
        if: matrix.name != 'fedora'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools ca-certificates \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-effects qml6-module-qtquick-dialogs \
            libtomlplusplus-dev libqt6sql6-sqlite libkf6syntaxhighlighting-dev \
            qtkeychain-qt6-dev

      - uses: actions/checkout@v7
        with:
          submodules: true

      # One command covers configure, build, qmllint and ctest. The preset
      # turns compiler warnings into errors.
      - name: Configure, build, lint and test
        run: cmake --workflow --preset ci

      # Reviewers can see what a change looks like without building it.
      - name: Render screenshots
        if: matrix.name == 'fedora'
        run: make screenshots PRESET=ci

      - name: Upload screenshots
        if: matrix.name == 'fedora'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/ci/screenshots/
          if-no-files-found: error
