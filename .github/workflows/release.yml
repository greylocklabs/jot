name: Release

# A pushed vX.Y.Z tag publishes a release: the source tarball, .deb and .rpm
# packages, and the notes from CHANGELOG.md. Pull requests that touch packaging,
# and runs started by hand, build the same files without publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - core
      - .gitmodules
      - tests/package_smoke.sh
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check every file names that version
        run: core/tooling/check-version.sh "${{ steps.version.outputs.version }}"

      - name: Write the notes and the source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          # A tag must have its notes; a test build before the first release has none.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            core/tooling/release-notes.sh "$version" > notes.md
          else
            core/tooling/release-notes.sh "$version" > notes.md 2>/dev/null || echo "Test build." > notes.md
          fi
          git archive --prefix="jot-$version/" HEAD | xz -9 > "jot-$version.tar.xz"

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            notes.md
            jot-*.tar.xz
          if-no-files-found: error

  rpm:
    needs: source
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Build the package
        run: |
          version="${{ needs.source.outputs.version }}"
          dnf install -y --setopt=install_weak_deps=False rpm-build dnf-plugins-core xz tar
          tar -xf "jot-$version.tar.xz"
          dnf builddep -y "jot-$version/packaging/rpm/jot.spec"
          mkdir -p rpmbuild/SOURCES
          cp "jot-$version.tar.xz" rpmbuild/SOURCES/
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" "jot-$version/packaging/rpm/jot.spec"

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  deb:
    needs: source
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Build the package
        run: |
          version="${{ needs.source.outputs.version }}"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts equivs xz-utils
          tar -xf "jot-$version.tar.xz"
          cp "jot-$version.tar.xz" "jot_$version.orig.tar.xz"
          cd "jot-$version"
          cp -r packaging/debian debian
          mk-build-deps --install --remove \
            --tool "apt-get -y --no-install-recommends" debian/control
          dpkg-buildpackage -us -uc -b

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: "*.deb"
          if-no-files-found: error

  # Each package installed on a clean system, and run, before it is published.
  installed:
    needs: [rpm, deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
            package: rpm
          - name: debian
            image: debian:trixie
            package: deb
          # The package built on Debian, installed as is.
          - name: ubuntu
            image: ubuntu:26.04
            package: deb
    name: installed (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}
          path: packages

      - name: Install the package (Fedora)
        if: matrix.name == 'fedora'
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          $(find packages/RPMS -name 'jot-[0-9]*.rpm')

      # The offscreen platform the check draws with is not one a desktop needs.
      - name: Install the package (Debian and Ubuntu)
        if: matrix.name != 'fedora'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qt6-qpa-plugins ./packages/jot_*.deb

      - name: Run what was installed
        run: tests/package_smoke.sh shots

      - uses: actions/upload-artifact@v7
        with:
          name: installed-${{ matrix.name }}
          path: shots/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [source, rpm, deb, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Jot ${{ needs.source.outputs.version }}" \
            --notes-file dist/notes.md \
            dist/jot-*.tar.xz $(find dist -name '*.deb' -o -name '*.rpm')
